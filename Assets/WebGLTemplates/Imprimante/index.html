<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; font-family: system-ui, sans-serif; color: #e8edf2; }
      #unity-canvas { width: 100%; height: 100%; display: block; }
      #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #0b0f14; transition: opacity .4s; }
      #bar { width: min(320px, 70vw); height: 8px; background: #1d2630; border-radius: 4px; overflow: hidden; }
      #fill { height: 100%; width: 0; background: #1fb454; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader">
      <div>Chargement… <span id="pct">0</span> %</div>
      <div id="bar"><div id="fill"></div></div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, (progress) => {
        document.getElementById("fill").style.width = (progress * 100) + "%";
        document.getElementById("pct").textContent = Math.round(progress * 100);
      }).then(() => {
        const l = document.getElementById("loader");
        l.style.opacity = 0;
        setTimeout(() => l.remove(), 400);
      }).catch((message) => {
        document.getElementById("loader").innerHTML = "<div>Erreur de chargement : " + message + "</div>";
      });
    </script>
  </body>
</html>
